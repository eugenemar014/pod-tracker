services:
  - type: web
    name: pods-tracker-eugenemar
    env: node
    plan: free
    region: oregon
    buildCommand: |
      npm install
      npm --prefix server install
      npm --prefix client install
      npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: APP_ENV
        value: production
      - key: ADMIN_USERNAME
        value: eugenemar014
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pods-tracker-db
          property: connectionString

databases:
  - name: pods-tracker-db
    databaseName: pods_tracker
    user: pods_tracker
    plan: free
    region: oregon
    postgresMajorVersion: "16"
